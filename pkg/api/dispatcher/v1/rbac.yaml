apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prowjob-dispatcher-overrides
  namespace: ci
rules:
- apiGroups:
  - ci.openshift.io
  resources:
  - dispatchoverrides
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ci.openshift.io
  resources:
  - dispatchoverrides/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prowjob-dispatcher-overrides
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prowjob-dispatcher-overrides
subjects:
- kind: ServiceAccount
  name: prowjob-dispatcher
  namespace: ci
