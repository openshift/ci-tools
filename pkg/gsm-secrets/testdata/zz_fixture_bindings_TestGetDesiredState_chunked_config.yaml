  role: projects/test-project/roles/openshift_ci_secrets_updater
- condition:
    expression: resource.name.extract("secrets/{c}__") in ["st-01"]
    title: 'tp-updater: small-team'
  members:
  - group:small-team@redhat.com
  role: projects/test-project/roles/openshift_ci_secrets_updater
