cluster_groups:
  build-farm:
  - app.ci
  - build01
  - build02
  dp-managed:
  - build01
  - build02
groups:
  test-platform-ci-admins:
    clusters:
    - app.ci
    secret_collections:
    - alpha-secrets
    updater_service_accounts:
    - alpha-secrets
  team-noop:
    cluster_groups:
    - dp-managed
  # Owns several collections, so its two bindings carry multi-element "in" lists and
  # prove SetIamPolicy accepts a single binding covering a whole group. This must be a
  # group that actually exists in the directory, otherwise SetIamPolicy rejects its
  # bindings with "Group ... does not exist".
  test-platform-gsm-secrets-owners:
    secret_collections:
    - large-secrets-01
    - large-secrets-02
    - large-secrets-03
    - large-secrets-04
    - large-secrets-05
    - large-secrets-06

