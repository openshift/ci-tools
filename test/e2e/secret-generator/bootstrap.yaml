cluster_groups:
  build_farm:
  - core-ci
  - app.ci
  - build01
  - build02
  - vsphere
secret_configs:
- from:
    sa.config-updater.core-ci.config:
      field: sa.config-updater.core-ci.config
      item: build_farm
    sa.config-updater.app.ci.config:
      field: sa.config-updater.app.ci.config
      item: build_farm
    sa.config-updater.build01.config:
      field: sa.config-updater.build01.config
      item: build_farm
    sa.config-updater.build02.config:
      field: sa.config-updater.build02.config
      item: build_farm
  to:
  - cluster_groups:
    - build_farm
    name: build-farm-credentials
    namespace: ci
